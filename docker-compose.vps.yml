# VPS / E2E 用。XREA(PHP8.1 + MariaDB10.6)に合わせた構成。
#   docker compose -f docker-compose.vps.yml --env-file .env.vps up -d --build
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        ENV_FILE: deploy/.env.build
    env_file: .env.vps
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - app-storage:/var/www/html/storage
    restart: unless-stopped
  # 古い API トークンの掃除(日次)。XREA の cron の代わり
  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        ENV_FILE: deploy/.env.build
    env_file: .env.vps
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "while true; do php artisan command:DeletePersonalAccessToken; sleep 86400; done"]
    restart: unless-stopped
  # HTTPS(ドメイン取得後に SITE_ADDRESS=your.example.com で有効化): --profile https
  caddy:
    image: caddy:2
    profiles: ["https"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped
  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
volumes:
  caddy-data:
  app-storage:
  db-data:
